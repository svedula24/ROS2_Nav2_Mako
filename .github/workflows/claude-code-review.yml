# Claude code review on every pull request (the review workflow from the Claude Code docs, "Run a skill":
# https://code.claude.com/docs/en/github-actions#run-a-skill). It installs the official code-review plugin and runs
# the same /code-review skill as a local session, with --comment so the findings land on the PR as inline comments
# (or one "no issues" summary). It never approves or blocks; the decision to merge stays with the author.
#
# Authentication: ONE repository secret, either
#   ANTHROPIC_API_KEY          a Claude API key (Claude Console), or
#   CLAUDE_CODE_OAUTH_TOKEN    a subscription token from `claude setup-token`
# `/install-github-app` in a Claude Code session on this repo installs the GitHub App and saves the secret for you.
# Until a secret exists the job skips with a notice instead of failing, so CI stays green.
#
# Review guidance: CLAUDE.md (project rules, read by the local /code-review too) and REVIEW.md (review-only rules,
# read by the hosted Code Review service from the default branch). The skill here reads CLAUDE.md.
#
# Fork pull requests get no secrets from GitHub on a public repository, so the review runs only for branches in
# this repository (same as the docs example).
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:                     # a newer push to the same PR supersedes the running review
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check for a Claude credential
        if: env.HAS_API_KEY != 'true' && env.HAS_OAUTH_TOKEN != 'true'
        run: |
          echo "::notice title=Claude Code Review skipped::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret on this repository. Run /install-github-app in Claude Code, or add one under Settings -> Secrets and variables -> Actions."
      - uses: actions/checkout@v6
        if: env.HAS_API_KEY == 'true' || env.HAS_OAUTH_TOKEN == 'true'
        with:
          fetch-depth: 1
      - name: Review with the code-review plugin (API key)
        if: env.HAS_API_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
      - name: Review with the code-review plugin (subscription token)
        if: env.HAS_API_KEY != 'true' && env.HAS_OAUTH_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
